name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: study_space_test
          POSTGRES_USER: study_fixture
          POSTGRES_PASSWORD: synthetic-ci-fixture
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U study_fixture -d study_space_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Validate release source
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' cli/Cargo.toml | head -1)" = "$version"
      - name: Frontend tests
        run: docker run --rm -v "$PWD/web:/source" -w /source oven/bun:1.3.9 sh -c 'bun install --frozen-lockfile && bun run test'
      - name: API tests
        env:
          STUDY_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=study_space_test;Username=study_fixture;Password=synthetic-ci-fixture
        run: |
          docker build --target checks -t study-space:checks .
          docker run --rm --network host -e STUDY_TEST_POSTGRES study-space:checks
      - name: CLI tests and build
        run: docker run --rm -v "$PWD/cli:/source" -w /source rust:1.93-bookworm sh -c 'cargo test --locked && cargo build --release --locked'
      - name: Native CLI contract
        run: python3 cli/tests/test_native.py
      - name: Installer contract
        run: python3 scripts/install/test_installer.py
      - name: Source bundle contract
        run: python3 scripts/release/test_package.py
      - name: Package exact release source
        run: bash scripts/release/package.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA"
      - name: Validate released source build
        run: |
          source_dir=$(mktemp -d)
          trap 'rm -rf "$source_dir"' EXIT
          tar -xzf artifacts/study-space-bundle.tar.gz -C "$source_dir"
          docker build \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --tag "study-space-local:$GITHUB_REF_NAME-$GITHUB_SHA" \
            "$source_dir/source"
      - name: Publish installer and matched assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifacts/VERSION artifacts/SHA256SUMS artifacts/manifest.json \
            artifacts/install.sh artifacts/study-linux-x86_64.tar.gz artifacts/study-space-bundle.tar.gz \
            --title "Study Space $GITHUB_REF_NAME" "${flags[@]}"
